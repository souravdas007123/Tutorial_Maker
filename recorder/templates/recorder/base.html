<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tutorial Maker{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { --ink:#1d2433; --muted:#6b7385; --line:#e3e6ee; --brand:#4f46e5; --bg:#f6f7fb; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .wrap { max-width:960px; margin:0 auto; padding:16px 20px; }
    header .wrap { display:flex; justify-content:space-between; align-items:center; }
    header a { color:var(--ink); text-decoration:none; font-weight:600; }
    main.wrap { padding-top:28px; padding-bottom:60px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    label { display:block; font-weight:600; margin:14px 0 4px; }
    input[type=url], input[type=text], input[type=password], select, textarea {
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    textarea { min-height:90px; resize:vertical; }
    .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 18px;
           font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
    .muted { color:var(--muted); font-size:14px; }
    .err { color:#b42318; font-size:14px; }
    .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; background:#eef0ff; color:var(--brand); }
    .pill.failed { background:#fee4e2; color:#b42318; } .pill.done { background:#dcfae6; color:#067647; }
    .step { display:grid; grid-template-columns:260px 1fr; gap:16px; }
    .step img { width:100%; border-radius:8px; border:1px solid var(--line); }
    .checkbox-row label { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
    video { width:100%; border-radius:12px; background:#000; }
    @media (max-width:640px) { .step { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a href="{% url 'job_list' %}">🎬 Tutorial Maker</a>
    <a class="btn" href="{% url 'job_new' %}">+ New tutorial</a>
  </div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
